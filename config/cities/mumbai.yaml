# Mumbai: Razorpay, cash on delivery allowed, no live tracking or express delivery yet.
city: mumbai
displayName: Mumbai
timezone: Asia/Kolkata
currency: INR
languages: [en, hi, mr]
features:
  cash_on_delivery: true
  scheduled_orders: true
  live_tracking: false
payments:
  provider: razorpay
limits:
  maxOrderValue: 50000
