# Test, build the Docker image, smoke-test the container, and push it to GHCR.
#
#   Pull request            -> test + build + smoke test (image is NOT pushed)
#   PR with label build:image -> also pushes ghcr.io/<owner>/<repo>:pr-<number>
#   Push to main / develop  -> pushes :main or :develop, plus :<commit sha>
#   Tag v1.2.3              -> pushes :1.2.3
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main, develop]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    # Adding an unrelated label shouldn't rerun everything.
    if: github.event.action != 'labeled' || github.event.label.name == 'build:image'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate city configs
        run: npm run validate:cities
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'build:image') }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: city-app:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name app -p 3000:3000 city-app:test
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break; sleep 1; done
          echo
          curl -sf localhost:3000/health | grep -q '"status":"ok"'
          curl -sf -H 'X-City: mumbai' localhost:3000/city | grep -q '"currency":"INR"'
          curl -sf -H 'X-City: dubai'  localhost:3000/city | grep -q '"currency":"AED"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-City: atlantis' localhost:3000/city)
          [ "$code" = 404 ] || { echo "expected 404 for unknown city, got $code"; exit 1; }
          echo "Smoke test passed"
      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
