# Raise a PR with a city label and CI builds that city's image with only that city's config.
#
#   city:mumbai / city:delhi / city:dubai   build that city      city:all   build every city
#   Editing config/cities/<city>.yaml adds that city automatically.
#
#   Event                 Image pushed to ghcr.io/<owner>/<repo>
#   PR with city label    :<city>-pr-<number>
#   Push to develop       :<city>-develop, :<city>-<sha>      (cities from the merged PR's labels)
#   Push to main          :<city>-main,    :<city>-<sha>      (cities from the merged PR's labels)
#   Tag v1.2.3            :<city>-1.2.3 for every city
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [main, develop]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  test:
    # Adding/removing a non-city label shouldn't rerun the tests.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      startsWith(github.event.label.name, 'city:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate city configs
        run: npm run validate:cities
      - run: npm test

  cities:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.resolve.outputs.cities }}
      has_cities: ${{ steps.resolve.outputs.has_cities }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Labels and changed files
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed="$RUNNER_TEMP/changed.txt"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*)
              labels="$PR_LABELS"
              gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only > "$changed"
              ;;
            push:refs/tags/*)
              labels='["city:all"]'
              : > "$changed"
              ;;
            *)
              # Push to develop/main: use the labels of the PR that was merged.
              labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name | select(startswith("city:"))]')
              git diff --name-only HEAD^ HEAD > "$changed" || : > "$changed"
              ;;
          esac
          # $GITHUB_OUTPUT values must be on one line; toJSON() pretty-prints across several.
          labels=$(jq -c . <<<"$labels")
          echo "labels: $labels"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Resolve cities
        id: resolve
        env:
          LABELS: ${{ steps.input.outputs.labels }}
        run: |
          args=(--labels "$LABELS" --changed-files "${{ steps.input.outputs.changed }}")
          # Every PR must say which city it is for.
          [[ "$GITHUB_EVENT_NAME" == pull_request ]] && args+=(--require)
          node .github/scripts/city-targets.mjs "${args[@]}"

  image:
    needs: cities
    if: needs.cities.outputs.has_cities == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        city: ${{ fromJSON(needs.cities.outputs.cities) }}
    name: image (${{ matrix.city }})
    env:
      # Fork PRs can't push to this repo's registry.
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            prefix=${{ matrix.city }}-,onlatest=true
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=long,prefix=${{ matrix.city }}-,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.city }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: CITY=${{ matrix.city }}
          tags: city-app:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (${{ matrix.city }} only)
        env:
          CITY: ${{ matrix.city }}
        run: |
          docker run -d --name app -p 3000:3000 city-app:test
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break; sleep 1; done
          echo
          health=$(curl -sf localhost:3000/health)
          [ "$health" = "{\"status\":\"ok\",\"cities\":[\"$CITY\"]}" ] \
            || { echo "expected only $CITY in /health, got $health"; exit 1; }
          curl -sf -H "X-City: $CITY" localhost:3000/city | grep -q "\"city\":\"$CITY\""
          for other in $(ls config/cities | sed 's/\.ya\?ml$//' | grep -vx "$CITY"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-City: $other" localhost:3000/city)
            [ "$code" = 404 ] || { echo "$CITY image should not serve $other (got $code)"; exit 1; }
          done
          echo "Smoke test passed: image serves $CITY and nothing else"
      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push ${{ matrix.city }} image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: CITY=${{ matrix.city }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "### ${{ matrix.city }} image" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
